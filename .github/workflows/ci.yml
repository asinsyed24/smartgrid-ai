name: SmartGrid AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DagsHub authentication
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user asinsyed24
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull DVC data
        run: |
          dvc pull

      - name: Verify Python files
        run: |
          python -m py_compile src/preprocessing.py
          python -m py_compile src/train.py
          python -m py_compile api/main.py

      - name: CI completed
        run: echo "SmartGrid AI CI pipeline passed successfully"